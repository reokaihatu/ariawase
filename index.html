<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 世界観: 夜の机に広げた切り抜き文字。切り貼りした言葉で脅迫状のような一言を作る。単一テーマ(暗)。 */
:root{
  --bg:#17161d; --panel:#211f2b; --line:#383546; --ink:#f4efe6; --mute:#a39fb3;
  --sun:#ffd23f; --sun-d:#b78f00; --pink:#ff6b9d; --mint:#43e0c1; --sky:#6ec5ff;
  --paper:#f6f0e2; --paper-ink:#1d1a16;
  --f-body:'Zen Maru Gothic',system-ui,-apple-system,'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --f-disp:'Dela Gothic One','Zen Maru Gothic',system-ui,sans-serif;
  --f-serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;line-height:1.5}
body{min-height:100dvh;background-image:radial-gradient(1200px 500px at 50% -10%,#2a2740 0,transparent 70%)}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3,p{margin:0}
.note{color:var(--mute);font-size:13px}

/* 切り抜きカード */
.chip{border:0;border-radius:3px;min-height:46px;padding:6px 14px;font-size:19px;color:var(--paper-ink);background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.25);transition:transform .12s}
.chip:active{transform:translateY(2px) rotate(0)!important}
.p0{background:#f6f0e2}.p1{background:#ffe066}.p2{background:#ffb3cf}.p3{background:#a8f0de}.p4{background:#b5defc}
.f0{font-family:var(--f-body);font-weight:900}.f1{font-family:var(--f-disp);font-weight:400;font-size:17px}.f2{font-family:var(--f-serif);font-weight:800;font-size:21px}
.r0{transform:rotate(-2deg)}.r1{transform:rotate(-1deg)}.r2{transform:rotate(0)}.r3{transform:rotate(1.2deg)}.r4{transform:rotate(2deg)}
.chip.conn{background:#dcc98d;min-height:40px;font-size:16px;padding:4px 12px;border-radius:2px}
.chip.sel{outline:3px solid var(--pink);outline-offset:2px}
.chip .pt{font-size:.62em;margin-left:2px;opacity:.75;font-weight:700}
.chip .pt.off{text-decoration:line-through;opacity:.35}
.chip.base{box-shadow:0 2px 0 rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.25),inset 0 0 0 2px rgba(29,26,22,.22)}
.cutrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cutrow>span{font-size:12px;color:var(--mute)}
.cutrow .cutprev{font-family:var(--f-serif);font-weight:800;font-size:22px;color:var(--ink);margin-right:6px}
.cutrow .cutprev s{color:var(--pink);opacity:.6}
.cutrow button{min-height:38px;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 12px;font-weight:700;font-size:14px}
.cutrow button[disabled]{opacity:.35}
.ptrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ptrow>span{font-size:12px;color:var(--mute);margin-right:2px}
.ptrow button{min-width:38px;min-height:38px;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:900;font-size:16px}
.ptrow button.on{border-color:var(--sun);color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center}

/* ホーム */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:18px}
.logo{font-family:var(--f-disp);font-size:56px;line-height:1.05;letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:4px}
.logo span{display:inline-block;padding:2px 8px;color:var(--paper-ink);border-radius:3px;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.logo span:nth-child(1){background:#ffe066;transform:rotate(-3deg)}
.logo span:nth-child(2){background:#ffb3cf;transform:rotate(2deg)}
.logo span:nth-child(3){background:#a8f0de;transform:rotate(-1.5deg)}
.logo span:nth-child(4){background:#b5defc;transform:rotate(2.5deg)}
.logo span:nth-child(5){background:#f6f0e2;transform:rotate(-2deg)}
.tag{font-size:17px;color:var(--ink);margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.field input,.row input{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;font-size:18px;color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:10px}
.btn{background:var(--sun);color:var(--paper-ink);border:0;border-radius:14px;font-weight:900;font-size:18px;padding:13px 18px;box-shadow:0 4px 0 var(--sun-d);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--mint);box-shadow:0 4px 0 #1b9a82;white-space:nowrap}
.btn.alt:active:not([disabled]){box-shadow:0 1px 0 #1b9a82}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-size:15px;padding:10px 14px}
.btn.ghost:active:not([disabled]){box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{font-size:14px;padding:8px 12px;border-radius:10px}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
details.how summary{cursor:pointer;font-weight:700}
details.how ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* ヘッダー・スコア */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--mute)}
.head b{color:var(--ink);font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.08em}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:inline-flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.pl i{font-style:normal;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b{font-variant-numeric:tabular-nums;color:var(--sun)}
.pl.me{border-color:var(--sky)}
.pl.par{background:#3a2f12;border-color:var(--sun)}
.pl.par i::before{content:'聞き手 ';color:var(--sun);font-size:11px}

/* お題 */
.prompt{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:14px 16px 16px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:rotate(-.5deg);display:flex;flex-direction:column;gap:4px}
.prompt small{font-weight:900;letter-spacing:.2em;color:#a1392b;font-size:12px}
.prompt p{font-family:var(--f-serif);font-weight:800;font-size:23px;line-height:1.45}
.prompt mark{background:linear-gradient(transparent 55%,var(--sun) 55%);color:inherit;padding:0 2px}

/* タイマー */
.timer{display:flex;align-items:center;gap:12px}
.timer>div{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
#bar{height:100%;width:100%;background:var(--mint);border-radius:99px;transition:width .3s linear}
.timer.low #bar{background:var(--pink)}
#tm{font-family:var(--f-disp);font-size:24px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.timer.low #tm{color:var(--pink)}

/* 組み立て: 選んだカードは画面上部に固定し、スクロールしても見えて、そこから助詞・カットを操作できる */
.bench{position:sticky;top:0;z-index:10;margin:0 -16px;padding:8px 16px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;max-height:58dvh;overflow-y:auto;box-shadow:0 12px 14px -10px rgba(0,0,0,.7);border-bottom:1px solid var(--line)}
.bench .timer>div{height:8px}.bench #tm{font-size:20px}
.bench .line{min-height:62px;padding:8px 10px;gap:8px}
.bench{gap:6px;max-height:52dvh}
.bench .ctl{gap:6px}.bench .btn.sm{min-height:34px;padding:2px 10px;font-size:13px}
.bench .cutrow,.bench .ptrow{gap:5px}.bench .cutrow .cutprev{font-size:17px;margin-right:2px}
.bench .cutrow button,.bench .ptrow button{min-height:34px;min-width:34px;padding:0 10px;font-size:14px}
.mini{font-size:13px;line-height:1.35;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini b{color:#e58a7a;letter-spacing:.1em;margin-right:4px}.mini mark{background:none;color:var(--sun);font-weight:700}

.line{min-height:92px;background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center}
.line .ph{color:var(--mute);font-size:14px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.lab{font-size:12px;letter-spacing:.15em;color:var(--mute);margin-bottom:-6px}
.wait{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wait h2{font-size:20px}
.note-card{background:var(--paper);color:var(--paper-ink);font-family:var(--f-serif);font-weight:800;font-size:22px;padding:12px 16px;border-radius:4px;transform:rotate(-.6deg);box-shadow:0 6px 14px rgba(0,0,0,.35);word-break:break-all}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-size:13px;border-radius:99px;padding:2px 10px;border:1px solid var(--line);color:var(--mute)}
.dot.ok{border-color:var(--mint);color:var(--mint)}

/* 審査・結果 */
.lead{font-size:15px}
.subs{display:flex;flex-direction:column;gap:14px}
.sub{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:14px 16px;box-shadow:0 6px 14px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;position:relative;text-align:left;border:0;width:100%}
.sub.n0{background:#f6f0e2}.sub.n1{background:#ffe066}.sub.n2{background:#ffb3cf}.sub.n3{background:#a8f0de}.sub.n4{background:#b5defc}
.sub p{font-family:var(--f-serif);font-weight:800;font-size:23px;line-height:1.5;word-break:break-all}
.sub.sel{outline:4px solid var(--pink);outline-offset:3px}
.sub.mine::after{content:'あなた';position:absolute;top:-9px;right:10px;background:var(--sky);color:var(--paper-ink);font-size:12px;font-weight:900;border-radius:99px;padding:0 10px}
.clap{align-self:flex-start;background:var(--paper-ink);color:var(--paper);border:0;border-radius:99px;padding:6px 16px;font-weight:900;font-size:14px}
.clap.on{background:var(--pink);color:var(--paper-ink)}
.clap[disabled]{opacity:.35}
.win{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:20px 18px;text-align:center;box-shadow:0 0 0 4px var(--sun),0 14px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.win small{font-weight:900;letter-spacing:.25em;color:#a1392b}
.win p{font-family:var(--f-serif);font-weight:800;font-size:28px;line-height:1.4;word-break:break-all}
.win .by{font-size:15px;font-weight:700}
@keyframes pop{from{transform:scale(.8) rotate(-3deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:center}
.rw p{font-family:var(--f-serif);font-weight:800;font-size:17px;word-break:break-all}
.rw .meta{font-size:12px;color:var(--mute)}
.rw .pts{grid-row:1/3;grid-column:2;font-family:var(--f-disp);font-size:24px;color:var(--sun);font-variant-numeric:tabular-nums}
.rw .pts.z{color:var(--mute)}

/* ロビー・結果発表 */
.code{font-family:var(--f-disp);font-size:52px;letter-spacing:.18em;text-align:center;color:var(--sun)}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg>span{color:var(--mute);font-size:13px;min-width:5.5em}
.seg button{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:700}
.seg button.on{border-color:var(--sun);color:var(--sun)}
.plist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.plist .x{background:none;border:0;color:var(--mute);font-size:20px;padding:0 6px}
.rank{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rank .n{font-family:var(--f-disp);font-size:28px;width:1.5em;color:var(--mute)}
.rank.first{border-color:var(--sun);background:#2e2812}
.rank.first .n{color:var(--sun)}
.rank .nm{flex:1;font-weight:900;font-size:19px}
.rank .sc{font-family:var(--f-disp);font-size:26px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper-ink);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.logo{font-size:46px}.prompt p{font-size:20px}}

/* チャット */
#chatbtn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:2px solid var(--sun);background:var(--panel);font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:20;padding:0}
#chatbtn[hidden],#chatbox[hidden],#chatbadge[hidden]{display:none}
#chatbadge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font-size:12px;line-height:22px;font-weight:900;padding:0 5px}
#chatbox{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:min(60dvh,460px);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#chatbox header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:900}
#chatx{background:none;border:1px solid var(--line);border-radius:10px;padding:2px 10px;font-size:13px}
#chatlist{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cm{max-width:84%;align-self:flex-start}.cm small{display:block;color:var(--mute);font-size:11px;margin:0 6px 1px}
.cm span{display:inline-block;background:#322f42;border-radius:14px 14px 14px 4px;padding:6px 12px;word-break:break-all;text-align:left}
.cm.me{align-self:flex-end;text-align:right}.cm.me span{background:var(--sun);color:var(--paper-ink);border-radius:14px 14px 4px 14px}
.cm.empty{align-self:center;color:var(--mute);font-size:13px}
#chatform{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#chatin{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
#chatform button{border:0;border-radius:12px;background:var(--sun);color:var(--paper-ink);font-weight:900;padding:0 18px}
#bgmbtn{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:20;padding:0}
#bgmbtn.on{border-color:var(--mint)}
</style>
</head>

  });

function doResult(sid){
  clearTimers();
  const cnt={};Object.values(H.claps).forEach(s=>cnt[s]=(cnt[s]||0)+1);
  const max=Math.max(0,...Object.values(cnt));
  const rows=H.subs.map(s=>{
    let pts=0;
    if(sid!==null&&s.sid===sid)pts+=2;
    if(S.clapOn&&max>0&&(cnt[s.sid]||0)===max)pts+=1;
    const p=pl(s.pid);if(p)p.score+=pts;
    return [s.sid,s.pid,cnt[s.sid]||0,pts];
  });

}

/* ================= 手札・組み立て ================= */
function draw(k,hand,pool){
  const have=new Set(hand.map(c=>c.t));
  let src=pool||DECK[k];
  if(k==='e'&&!hand.some(c=>CORE_E.includes(c.t)))src=CORE_E;   // 文を閉じられる語尾を最低1枚
  let t,n=0;
  do{t=src[rnd(src.length)];n++}while(have.has(t)&&n<40);
  const c={id:++cid,t,k};
  if(k==='n'){
    const first=!hand.some(x=>x.k==='n'&&CORE_P.includes(x.pt));   // 最初の名詞は「を・に・が」のどれか
    c.pt=first?CORE_P[rnd(CORE_P.length)]:PTS[rnd(PTS.length)];
    c.on=true;
  }
  return c;
}
/* お題のジャンルに合う言葉を多めに、残りは全体から配る(ズレを少し残す) */
function makeHand(genre){
  const G=GENRES[genre]||null, hand=[];
  const forced={n:2,v:2,a:0,d:0,e:0}, prob={n:.5,v:.5,a:.7,d:.6,e:0};
  KIND_ORDER.forEach(k=>{
    for(let i=0;i<SPEC[k];i++){
      const useG=G&&G[k]&&(i<forced[k]||Math.random()<prob[k]);
      hand.push(draw(k,hand,useG?G[k]:null));
    }
  });
  return hand;
}
const baseCards=()=>BASE.map(b=>Object.assign({id:++cid,t:b.t,k:b.k,base:1},b.pt?{pt:b.pt,on:true,opts:PT_OPTS}:{},b.alts?{alts:b.alts}:{}));
const chars=c=>Array.from(c.t);
const cardBody=c=>{const a=chars(c);return a.slice(c.h||0,a.length-(c.tl||0)).join('')};
const cardText=c=>cardBody(c)+(c.pt&&c.on?c.pt:'');
const roundGenre=()=>((PROMPTS[S.pi]||[])[0]);
function syncLocal(){
  if(!S)return;
  if(S.phase==='lobby'){
    if(L.round!==-2)L={round:-2,hand:[],line:[],sel:-1,submitted:false,myText:'',clap:null,pickSel:null};
    return;
  }
  if(S.round!==L.round){
    L.round=S.round;L.line=[];L.sel=-1;L.clap=null;L.pickSel=null;
    L.submitted=S.submitted.includes(me.pid);if(!L.submitted)L.myText='';
    L.hand=baseCards().concat(makeHand(roundGenre()));
  }
}
function doSubmit(){
  if(L.submitted||L.line.length<(S.minC||1))return;
  const text=L.line.map(cardText).join(''), n=L.line.length;
  L.myText=text;L.submitted=true;L.line=[];L.sel=-1;
  reliable('submit',{text,n},()=>S.submitted.includes(me.pid)||S.phase!=='write');
  render();
}

  if(S.ns&&!S.subs)return head()+promptHTML()+`<p class="lead">結果を受け取っています…</p>`+strip();
  const R=S.res, sm=new Map(S.subs||[]);
  const rows=R.rows.slice().sort((a,b)=>b[3]-a[3]||b[2]-a[2]);
  const win=R.pick!==null?R.rows.find(r=>r[0]===R.pick):null;
  const last=S.round+1>=S.total;
  let h=head()+promptHTML();
  if(win){const p=pl(win[1]);h+=`<section class="win"><small>聞き手のえらぶ一枚</small><p>${esc(sm.get(win[0])||'')}</p><span class="by">${esc(p?p.name:'?')} ・ +${win[3]}点</span></section>`}
  else h+=`<section class="wait"><h2>${rows.length?'今回は聞き手が選ばずに終了':'今回は作品がありませんでした'}</h2></section>`;
  h+=`<div class="rows">${rows.map(r=>{const p=pl(r[1]);return `<div class="rw"><p>${esc(sm.get(r[0])||'')}</p><span class="pts${r[3]?'':' z'}">+${r[3]}</span><span class="meta">${esc(p?p.name:'?')}${S.clapOn?` ・ ウケた ${r[2]}`:''}</span></div>`}).join('')}</div>`;
  h+=strip();
  h+=isHost?`<button class="btn" data-a="next">${last?'最終結果へ':'次のラウンドへ'}</button>`:'<p class="note">ホストが進めるのを待っています…</p>';
  return h;
}
function end(){
  const rs=S.players.slice().sort((a,b)=>b.score-a.score);
  let rank=0,prev=null;
  return `${head()}
  <h2 style="font-family:var(--f-disp);font-weight:400;font-size:30px">けっか発表</h2>
  <div class="rows">${rs.map((p,i)=>{if(p.score!==prev){rank=i+1;prev=p.score}return `<div class="rank${rank===1?' first':''}"><span class="n">${rank}</span><span class="nm">${esc(p.name)}${p.pid===me.pid?' (あなた)':''}</span><span class="sc">${p.score}</span></div>`}).join('')}</div>
  ${isHost?`<button class="btn" data-a="rematch">同じメンバーでもう一度</button>`:'<p class="note">ホストの操作を待っています…</p>'}`;
}
function view(){
  if(!S)return screen==='joining'?joining():home();
  return ({lobby,write,judge,result,end}[S.phase]||home)();
}
function render(){
  $('#app').innerHTML=view();
  tick();
  chatSync();
}
function tick(){
  if(!S||S.phase!=='write')return;
  const bar=$('#bar'),tm=$('#tm'),box=$('#timer');if(!bar)return;
  const left=Math.max(0,S.endsAt-(Date.now()+skew));
  tm.textContent=Math.ceil(left/1000);
  bar.style.width=Math.min(100,left/(S.secs*1000)*100)+'%';
  box.classList.toggle('low',left<=10000);
  if(left<=0&&!L.submitted&&L.line.length>=(S.minC||1)&&S.parent!==me.pid)doSubmit();
}
setInterval(tick,250);

/* ================= 操作 ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const d=el.dataset;
  switch(d.a){
    case 'create':hostCreate(false);break;
    case 'solo':hostCreate(true);break;
    case 'join':joinRoom();break;
    case 'retry':if(isHost&&S&&!net&&!netBusy){netBusy=true;render();openNet(S.code).then(n=>{net=n;netBusy=false;if(net)emitState();else toast('まだつながりません');render()}).catch(()=>{netBusy=false;render()})}break;
    case 'leave':leave();break;
    case 'addbot':if(isHost){addBot();pub()}break;
    case 'rm':if(isHost&&S.phase==='lobby'&&d.pid!==S.hostPid){S.players=S.players.filter(p=>p.pid!==d.pid);pub()}break;
    case 'laps':if(isHost){S.laps=+d.v;pub()}break;
    case 'minc':if(isHost&&S.phase==='lobby'&&[1,2,3,4,5,6].includes(+d.v)){S.minC=+d.v;pub()}break;
    case 'secs':if(isHost){S.secs=+d.v;pub()}break;
    case 'gen':if(isHost&&S.phase==='lobby'){const i=S.gs.indexOf(d.v);if(i>=0){if(S.gs.length>1)S.gs.splice(i,1)}else S.gs.push(d.v);pub()}break;
    case 'clapopt':if(isHost&&S.phase==='lobby'){S.clapOn=+d.v;pub()}break;
    case 'start':if(isHost)startGame();break;
    case 'next':if(isHost&&S.phase==='result')nextRound();break;
    case 'skip':if(isHost){if(S.phase==='write')toJudge();else if(S.phase==='judge')doResult(null)}break;
    case 'rematch':if(isHost){S.phase='lobby';S.players.forEach(p=>p.score=0);S.round=-1;pub()}break;
    case 'hand':{const c=L.hand.find(c=>c.id===+d.id);if(c&&!L.submitted&&!L.line.includes(c)){L.line.push(c);L.sel=-1}render();break}
    case 'lsel':L.sel=(L.sel===+d.i)?-1:+d.i;render();break;
    case 'lleft':if(L.sel>0){const i=L.sel;[L.line[i-1],L.line[i]]=[L.line[i],L.line[i-1]];L.sel--}render();break;
    case 'lright':if(L.sel>=0&&L.sel<L.line.length-1){const i=L.sel;[L.line[i+1],L.line[i]]=[L.line[i],L.line[i+1]];L.sel++}render();break;
    case 'lrm':if(L.line.length){const [r]=L.line.splice(L.sel>=0?L.sel:L.line.length-1,1);r.h=0;r.tl=0;if(r.alts)r.t=r.alts[0];L.sel=-1}render();break;
    case 'cut':{const c=L.sel>=0?L.line[L.sel]:null;
      if(c){const n=chars(c).length,dv=+d.v;let h=c.h||0,t=c.tl||0;
        if(d.w==='h')h+=dv;else t+=dv;
        if(h>=0&&t>=0&&h+t<=n-1){c.h=h;c.tl=t}}
      render();break}
    case 'altset':{const c=L.sel>=0?L.line[L.sel]:null;if(c&&c.alts&&c.alts.includes(d.v)){c.t=d.v;c.h=0;c.tl=0}render();break}
    case 'ptset':{const c=L.sel>=0?L.line[L.sel]:null;if(c&&c.opts){if(d.v==='none')c.on=false;else{c.pt=d.v;c.on=true}}render();break}
    case 'ptog':{const c=L.sel>=0?L.line[L.sel]:null;if(c&&c.pt){c.on=!c.on}render();break}
    case 'submit':doSubmit();break;
    case 'psel':if(clapReady()){L.pickSel=+d.sid;render()}break;
    case 'pick':if(L.pickSel!==null&&clapReady())reliable('pick',{sid:L.pickSel},()=>S.phase!=='judge');break;
    case 'clap':{const sid=+d.sid;if(L.clap===null){L.clap=sid;reliable('clap',{sid},()=>S.clapped.includes(me.pid)||S.phase!=='judge');render()}break}
  }
});
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&typeof claude==='undefined'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
</html>
