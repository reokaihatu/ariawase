<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 世界観: 夜の机に広げた切り抜き文字。切り貼りした言葉で脅迫状のような一言を作る。単一テーマ(暗)。 */
:root{
  --bg:#17161d; --panel:#211f2b; --line:#383546; --ink:#f4efe6; --mute:#a39fb3;
  --sun:#ffd23f; --sun-d:#b78f00; --pink:#ff6b9d; --mint:#43e0c1; --sky:#6ec5ff;
  --paper:#f6f0e2; --paper-ink:#1d1a16;
  --f-body:'Zen Maru Gothic',system-ui,-apple-system,'Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --f-disp:'Dela Gothic One','Zen Maru Gothic',system-ui,sans-serif;
  --f-serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;line-height:1.5}
body{min-height:100dvh;background-image:radial-gradient(1200px 500px at 50% -10%,#2a2740 0,transparent 70%)}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3,p{margin:0}
.note{color:var(--mute);font-size:13px}
.qli{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5}
.qli mark{background:none;color:var(--sun);font-weight:700}
#netwarn{position:fixed;top:0;left:0;right:0;z-index:40;background:#e5484d;color:#fff;text-align:center;padding:7px 10px;font-size:13px;font-weight:800}
#netwarn[hidden]{display:none}
.bring{display:flex;flex-direction:column;gap:8px}
.bring .row input{flex:1;min-width:0}
.hh{font-family:var(--f-disp);font-weight:400;font-size:24px;margin-top:6px}
.pv{display:flex;gap:8px;align-items:baseline;background:var(--panel);border-left:4px solid var(--sun);border-radius:8px;padding:6px 10px}
.pv b{flex:none;font-size:11px;color:var(--sun)}
.pv span{font-family:var(--f-serif);font-weight:800;font-size:17px;line-height:1.45;word-break:break-all}
#imgov{position:fixed;inset:0;z-index:90;background:rgba(10,9,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#imgov img{max-width:100%;max-height:68vh;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);background:#17161d}
#imgov .row{display:flex;gap:10px}
#imgov p{margin:0;color:var(--mute);font-size:12px}
.hist .hbtn{margin-top:4px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.hist small{color:var(--mute);font-size:12px}
.hist p{font-family:var(--f-serif);font-weight:800;font-size:20px;line-height:1.5;margin:4px 0}
.hist .by{color:var(--sun);font-size:13px;font-weight:700}

/* 切り抜きカード */
.chip{border:0;border-radius:3px;min-height:46px;padding:6px 14px;font-size:19px;color:var(--paper-ink);background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.25);transition:transform .12s}
.chip:active{transform:translateY(2px) rotate(0)!important}
.p0{background:#f6f0e2}.p1{background:#ffe066}.p2{background:#ffb3cf}.p3{background:#a8f0de}.p4{background:#b5defc}
.f0{font-family:var(--f-body);font-weight:900}.f1{font-family:var(--f-disp);font-weight:400;font-size:17px}.f2{font-family:var(--f-serif);font-weight:800;font-size:21px}
.r0{transform:rotate(-2deg)}.r1{transform:rotate(-1deg)}.r2{transform:rotate(0)}.r3{transform:rotate(1.2deg)}.r4{transform:rotate(2deg)}
.chip.conn{background:#dcc98d;min-height:40px;font-size:16px;padding:4px 12px;border-radius:2px}
.chip.sel{outline:3px solid var(--pink);outline-offset:2px}
.chip .pt{font-size:.62em;margin-left:2px;opacity:.75;font-weight:700}
.chip .pt.off{text-decoration:line-through;opacity:.35}
.chip.base{box-shadow:0 2px 0 rgba(0,0,0,.45),0 6px 12px rgba(0,0,0,.25),inset 0 0 0 2px rgba(29,26,22,.22)}
.cutrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cutrow>span{font-size:12px;color:var(--mute)}
.cutrow .cutprev{font-family:var(--f-serif);font-weight:800;font-size:22px;color:var(--ink);margin-right:6px}
.cutrow .cutprev s{color:var(--pink);opacity:.6}
.cutrow .cutmode{flex:1 1 100%;display:flex;gap:5px;align-items:center}
.cutrow .cutmode .cutreset{margin-left:auto}
.cutrow .cutmode button.on{background:var(--sun);color:var(--paper-ink);border-color:var(--sun)}
.cutrow .cutin{flex:1 1 100%;min-width:0;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:800 18px var(--f-serif);outline:none}
.cutrow .cutin:focus{border-color:var(--sun)}
.cutrow .cuthint{flex:1 1 100%;font-size:11px}
.cutrow button{min-height:38px;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 12px;font-weight:700;font-size:14px}
.cutrow button[disabled]{opacity:.35}
.ptrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ptrow>span{font-size:12px;color:var(--mute);margin-right:2px}
.ptrow button{min-width:38px;min-height:38px;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:900;font-size:16px}
.ptrow button.on{border-color:var(--sun);color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center}

/* ホーム */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:18px}
.logo{font-family:var(--f-disp);font-size:56px;line-height:1.05;letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:4px}
.logo span{display:inline-block;padding:2px 8px;color:var(--paper-ink);border-radius:3px;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.logo span:nth-child(1){background:#ffe066;transform:rotate(-3deg)}
.logo span:nth-child(2){background:#ffb3cf;transform:rotate(2deg)}
.logo span:nth-child(3){background:#a8f0de;transform:rotate(-1.5deg)}
.logo span:nth-child(4){background:#b5defc;transform:rotate(2.5deg)}
.logo span:nth-child(5){background:#f6f0e2;transform:rotate(-2deg)}
.tag{font-size:17px;color:var(--ink);margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.field input,.row input{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;font-size:18px;color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:10px}
.btn{background:var(--sun);color:var(--paper-ink);border:0;border-radius:14px;font-weight:900;font-size:18px;padding:13px 18px;box-shadow:0 4px 0 var(--sun-d);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--mint);box-shadow:0 4px 0 #1b9a82;white-space:nowrap}
.btn.alt:active:not([disabled]){box-shadow:0 1px 0 #1b9a82}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-size:15px;padding:10px 14px}
.btn.ghost:active:not([disabled]){box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{font-size:14px;padding:8px 12px;border-radius:10px}
details.how{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
details.how summary{cursor:pointer;font-weight:700}
details.how ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* ヘッダー・スコア */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--mute)}
.head b{color:var(--ink);font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.08em}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.pl{display:inline-flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.pl i{font-style:normal;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b{font-variant-numeric:tabular-nums;color:var(--sun)}
.pl.me{border-color:var(--sky)}
.pl.par{background:#3a2f12;border-color:var(--sun)}
.pl.par i::before{content:'聞き手 ';color:var(--sun);font-size:11px}

/* お題 */
.prompt{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:14px 16px 16px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:rotate(-.5deg);display:flex;flex-direction:column;gap:4px}
.prompt small{font-weight:900;letter-spacing:.2em;color:#a1392b;font-size:12px}
.prompt p{font-family:var(--f-serif);font-weight:800;font-size:23px;line-height:1.45}
.prompt mark{background:linear-gradient(transparent 55%,var(--sun) 55%);color:inherit;padding:0 2px}

/* タイマー */
.timer{display:flex;align-items:center;gap:12px}
.timer>div{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
#bar{height:100%;width:100%;background:var(--mint);border-radius:99px}
@keyframes aw-bar{from{width:100%}to{width:0}}
.timer.low #bar{background:var(--pink)}
#tm{font-family:var(--f-disp);font-size:24px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.timer.low #tm{color:var(--pink)}

/* 組み立て: 選んだカードは画面上部に固定し、スクロールしても見えて、そこから助詞・カットを操作できる */
.bench{position:sticky;top:0;z-index:10;margin:0 -16px;padding:8px 16px 12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;max-height:58dvh;overflow-y:auto;box-shadow:0 12px 14px -10px rgba(0,0,0,.7);border-bottom:1px solid var(--line)}
.bench .timer>div{height:8px}.bench #tm{font-size:20px}
.bench .line{min-height:62px;padding:8px 10px;gap:8px}
.bench{gap:6px;max-height:52dvh}
.bench .ctl{gap:6px}.bench .btn.sm{min-height:34px;padding:2px 10px;font-size:13px}
.bench .cutrow,.bench .ptrow{gap:5px}.bench .cutrow .cutprev{font-size:17px;margin-right:2px}
.bench .cutrow button,.bench .ptrow button{min-height:34px;min-width:34px;padding:0 10px;font-size:14px}
.mini{font-size:13px;line-height:1.35;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini b{color:#e58a7a;letter-spacing:.1em;margin-right:4px}.mini mark{background:none;color:var(--sun);font-weight:700}

.line .chip{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;-webkit-touch-callout:none}
.line .chip.drag{position:relative;z-index:40;cursor:grabbing;opacity:.92;transition:none!important;box-shadow:0 10px 22px rgba(0,0,0,.5)!important}
.line .chip.dropb{box-shadow:-6px 0 0 var(--sun),0 2px 0 rgba(0,0,0,.45)!important}
.line .chip.dropa{box-shadow:6px 0 0 var(--sun),0 2px 0 rgba(0,0,0,.45)!important}
.line{min-height:92px;background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center}
.line .ph{color:var(--mute);font-size:14px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.lab{font-size:12px;letter-spacing:.15em;color:var(--mute);margin-bottom:-6px}
.wait{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wait h2{font-size:20px}
.pickhint{margin:0;padding:8px 12px;border-radius:12px;border:1px dashed var(--sun);background:color-mix(in srgb,var(--sun) 12%,transparent);color:var(--sun);font-weight:700;font-size:14px;text-align:center}
.note-card{background:var(--paper);color:var(--paper-ink);font-family:var(--f-serif);font-weight:800;font-size:22px;padding:12px 16px;border-radius:4px;transform:rotate(-.6deg);box-shadow:0 6px 14px rgba(0,0,0,.35);word-break:break-all}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-size:13px;border-radius:99px;padding:2px 10px;border:1px solid var(--line);color:var(--mute)}
.dot.ok{border-color:var(--mint);color:var(--mint)}

.subs{display:flex;flex-direction:column;gap:14px}
.rooms{display:flex;flex-direction:column;gap:8px}
.rooms .note{margin:0}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.who b{font-size:11px;color:var(--sun)}
.who span{padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.who .ok{background:color-mix(in srgb,var(--mint) 22%,transparent);border-color:var(--mint);color:var(--mint);font-weight:800}
.who .wt{color:var(--mute)}
.sub{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:14px 16px;box-shadow:0 6px 14px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;position:relative;text-align:left;border:0;width:100%}
.sub.n0{background:#f6f0e2}.sub.n1{background:#ffe066}.sub.n2{background:#ffb3cf}.sub.n3{background:#a8f0de}.sub.n4{background:#b5defc}
.sub p{font-family:var(--f-serif);font-weight:800;font-size:23px;line-height:1.5;word-break:break-all}
.sub.sel{outline:4px solid var(--pink);outline-offset:3px}
.sub.mine::after{content:'あなた';position:absolute;top:-9px;right:10px;background:var(--sky);color:var(--paper-ink);font-size:12px;font-weight:900;border-radius:99px;padding:0 10px}
.clap{align-self:flex-start;background:var(--paper-ink);color:var(--paper);border:0;border-radius:99px;padding:6px 16px;font-weight:900;font-size:14px}
.clap.on{background:var(--pink);color:var(--paper-ink)}
.clap[disabled]{opacity:.35}
.win{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:20px 18px;text-align:center;box-shadow:0 0 0 4px var(--sun),0 14px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.win small{font-weight:900;letter-spacing:.25em;color:#a1392b}
.win p{font-family:var(--f-serif);font-weight:800;font-size:28px;line-height:1.4;word-break:break-all}
.win .by{font-size:15px;font-weight:700}
@keyframes pop{from{transform:scale(.8) rotate(-3deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:center}
.rw p{font-family:var(--f-serif);font-weight:800;font-size:17px;word-break:break-all}
.rw .meta{font-size:12px;color:var(--mute)}
.rw .pts{grid-row:1/3;grid-column:2;font-family:var(--f-disp);font-size:24px;color:var(--sun);font-variant-numeric:tabular-nums}
.rw .pts.z{color:var(--mute)}

/* ロビー・結果発表 */
.code{font-family:var(--f-disp);font-size:52px;letter-spacing:.18em;text-align:center;color:var(--sun)}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg>span{color:var(--mute);font-size:13px;min-width:5.5em}
.seg button{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:700}
.seg button.on{border-color:var(--sun);color:var(--sun)}
.plist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.plist .x{background:none;border:0;color:var(--mute);font-size:20px;padding:0 6px}
.rank{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rank .n{font-family:var(--f-disp);font-size:28px;width:1.5em;color:var(--mute)}
.rank.first{border-color:var(--sun);background:#2e2812}
.rank.first .n{color:var(--sun)}
.rank .nm{flex:1;font-weight:900;font-size:19px}
.rank .sc{font-family:var(--f-disp);font-size:26px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper-ink);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.logo{font-size:46px}.prompt p{font-size:20px}}

/* チャット */
#chatbtn{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:2px solid var(--sun);background:var(--panel);font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:20;padding:0}
#chatbtn[hidden],#chatbox[hidden],#chatbadge[hidden]{display:none}
#chatbadge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font-size:12px;line-height:22px;font-weight:900;padding:0 5px}
#chatbox{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:min(60dvh,460px);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.5)}

#chatx{background:none;border:1px solid var(--line);border-radius:10px;padding:2px 10px;font-size:13px}

.cm.me{align-self:flex-end;text-align:right}.cm.me span{background:var(--sun);color:var(--paper-ink);border-radius:14px 14px 4px 14px}
.cm.empty{align-self:center;color:var(--mute);font-size:13px}
#chatform{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#chatin{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
#chatform button{border:0;border-radius:12px;background:var(--sun);color:var(--paper-ink);font-weight:900;padding:0 18px}
#bgmbtn{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:20;padding:0}

#volpanel{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 62px);z-index:21;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px 12px;box-shadow:0 8px 22px rgba(0,0,0,.55);width:min(260px,calc(100vw - 28px));font-size:14px}

#bgmtoggle{width:100%;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:900}

#volpanel b{color:var(--sun)}

</style>
</head>

<div id="volpanel" hidden><button id="bgmtoggle" type="button" aria-pressed="false">BGM オフ</button><label for="volrange">音量 <b id="vollabel">100%</b></label><input id="volrange" type="range" min="0" max="200" step="1" value="100" aria-label="BGMの音量"></div>
<button id="chatbtn" type="button" aria-label="チャットを開く" hidden>💬<b id="chatbadge" hidden></b></button>
<section id="chatbox" aria-label="チャット" hidden>
  <header><span>チャット</span><button id="chatx" type="button">とじる</button></header>

  <form id="chatform" autocomplete="off"><input id="chatin" maxlength="40" placeholder="ひとこと(40文字まで)" enterkeyhint="send"><button type="submit">送る</button></form>

/* ===== Claudeなしで遊ぶための通信 =====
   公開MQTTサーバー(WebSocket)を中継に使う。部屋ごとに1つのトピックを購読し、全員の発言をそこへ流す。
   外部ライブラリは使わない。?broker=wss://… で中継サーバーを差し替えられる。 */
const BROKERS=(()=>{try{const b=new URLSearchParams(location.search).get('broker');if(b)return [b]}catch(e){}return ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://mqtt.eclipseprojects.io:443/mqtt','wss://test.mosquitto.org:8081']})();
let netErr='';
const TE=new TextEncoder(),TD=new TextDecoder();
const mqStr=s=>{const b=TE.encode(s);return [b.length>>8,b.length&255,...b]};
const mqLen=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return o};
const mqPkt=(first,body)=>Uint8Array.from([first,...mqLen(body.length),...body]);
function mqttRoom(code,opt){
  const topic='arioawase/v1/'+code, subT=(opt&&opt.sub)||topic, peer='q'+Math.random().toString(36).slice(2,10), hs={};
  let ws=null, ready=false, left=false, bi=0, pingT=null, buf=new Uint8Array(0), pid=1, firstDone=false, firstOK=null, firstNG=null;
  const api={
    name:code,
    emit:async(k,d)=>{
      if(!ready||!ws||ws.readyState!==1)return;                    // 切れている間は捨てる(ホストの再送で回復する)
      ws.send(mqPkt(0x30,[...mqStr(topic),...TE.encode(JSON.stringify({p:peer,k,d}))]));
    },
    pubTo:async(t,k,d)=>{if(!ready||!ws||ws.readyState!==1)return;ws.send(mqPkt(0x30,[...mqStr('arioawase/v1/'+t),...TE.encode(JSON.stringify({p:peer,k,d}))]))},   // 別のトピックへ流す(募集中の部屋の一覧用)
    on:(k,f)=>{(hs[k]=hs[k]||[]).push(f);return()=>{hs[k]=(hs[k]||[]).filter(x=>x!==f)}},
    leave:async()=>{left=true;ready=false;clearInterval(pingT);try{ws&&ws.close()}catch(e){}},
    connected:()=>ready
  };
  function onPacket(first,body){
    const type=first>>4;
    if(type===2){                                                   // CONNACK
      if(body[1]===0){ws.send(mqPkt(0x82,[pid>>8&255,pid&255,...mqStr(subT),0]));pid=(pid%65535)+1}
      else ws.close();
    }else if(type===9){                                             // SUBACK
      ready=true;clearInterval(pingT);const w=ws;
      pingT=setInterval(()=>{try{w.send(Uint8Array.of(0xC0,0))}catch(e){}},20000);
      if(!firstDone){firstDone=true;firstOK(api)}
    }else if(type===3){                                             // PUBLISH
      const tl=body[0]<<8|body[1];let i=2+tl;if((first>>1&3)>0)i+=2;
      let m;try{m=JSON.parse(TD.decode(body.subarray(i)))}catch(e){return}
      if(!m||typeof m.k!=='string')return;
      const me=m.p===peer;
      (hs[m.k]||[]).slice().forEach(f=>{try{f({topic:m.k,data:m.d,peer:m.p,isMe:me,sameTab:me})}catch(e){}});
    }
  }
  function feed(chunk){
    const n=new Uint8Array(buf.length+chunk.length);n.set(buf);n.set(chunk,buf.length);buf=n;
    for(;;){
      if(buf.length<2)return;
      let mul=1,len=0,i=1,b;
      do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128}while(b&128);
      if(buf.length<i+len)return;
      const first=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);
      onPacket(first,body);
    }
  }
  function open(){
    if(left)return;
    let w;
    const url=BROKERS[bi%BROKERS.length];
    try{w=new WebSocket(url,'mqtt')}catch(e){netErr='接続先を開けません('+(e&&e.name||'error')+')';bi++;setTimeout(open,300);return}
    ws=w;w.binaryType='arraybuffer';
    const to=setTimeout(()=>{if(!ready){netErr=url.replace(/^wss?:\/\//,'').split('/')[0]+' が応答しません';try{w.close()}catch(e){}}},5000);

        H.claps[a.pid]=a.sid;S.clapped=Object.keys(H.claps);pub();botPickSoon()}

/* 接続が切れた人は、一定時間ののちに自動で退室させる。同じ端末で戻ってくれば、点数と順番を引き継いで復帰する */
function dropPid(pid,why){
  if(!S||!H||pid===S.hostPid)return;
  const si=S.specs.findIndex(x=>x.pid===pid);
  if(si>=0){S.specs.splice(si,1);pub();return}
  const i=S.players.findIndex(p=>p.pid===pid);
  if(i<0||S.players[i].bot||S.phase==='end')return;
  const p=S.players[i], msg=why==='timeout'?p.name+'さんの接続が切れたので退室しました':p.name+'さんが退室しました';
  if(S.phase==='lobby'){S.players.splice(i,1);H.bp=H.bp.filter(x=>x.pid!==pid);delete S.bn[pid];pub();toast(msg);return}
  if(why==='timeout')H.ghost[pid]={name:p.name,score:p.score,idx:i,text:H.texts[pid]||null,round:S.round};
  S.players.splice(i,1);
  delete H.texts[pid];S.submitted=S.submitted.filter(x=>x!==pid);
  S.total=Math.max(S.round+1,S.total-S.laps);
  const wasParent=S.parent===pid;
  if(i<S.pk)S.pk--;
  toast(msg);
  if(S.players.length<3){clearTimers();S.phase='end';S.endWhy='人数が足りなくなったので、ここで終了しました';pub();emitHist();return}
  if(wasParent){
    S.pk=i-1;
    if(S.phase==='write'||S.phase==='judge'){clearTimers();S.round--;nextRound();return}   // 聞き手が落ちたラウンドはやり直し(次の人が聞き手)
  }
  pub();hostTick();
}
function restoreGhost(pid,g){
  delete H.ghost[pid];
  const idx=Math.min(g.idx,S.players.length);
  S.players.splice(idx,0,{pid,name:g.name,bot:0,score:g.score});
  if(idx<=S.pk)S.pk++;
  S.total+=S.laps;
  if(S.phase==='write'&&g.text&&g.round===S.round&&pid!==S.parent&&!(pid in H.texts)){H.texts[pid]=g.text;S.submitted.push(pid)}
  toast(g.name+'さんが復帰しました');
}
function watchdog(){
  if(!isHost||!S||!H)return;
  const now=Date.now();
  if(H.wt&&now-H.wt>4000)Object.keys(H.seen).forEach(k=>H.seen[k]=now);   // ホスト自身が止まっていた間は、全員に猶予をあげる
  H.wt=now;
  if(S.phase==='end')return;
  const stale=pid=>now-(H.seen[pid]||(H.seen[pid]=now))>DROP_MS;
  S.specs.filter(x=>stale(x.pid)).forEach(x=>dropPid(x.pid,'timeout'));
  S.players.filter(p=>!p.bot&&p.pid!==S.hostPid&&stale(p.pid)).forEach(p=>dropPid(p.pid,'timeout'));
}
function emitHist(){

const clapReady=()=>!S.clapOn||(S.cneed||[]).filter(pid=>pl(pid)).every(pid=>S.clapped.includes(pid));
function botPickSoon(){const par=pl(S.parent);if(par&&par.bot&&S.phase==='judge'&&clapReady()){H.timers.push(setTimeout(()=>{if(S.phase==='judge'&&clapReady())doResult(rnd(H.subs.length))},1500+rnd(2500)))}}
function clearTimers(){H.timers.forEach(clearTimeout);H.timers=[]}
function addBot(){

function botLine(){
  const h=makeHand(roundGenre());
  const ns=h.filter(c=>c.k==='n'),vs=h.filter(c=>c.k==='v'),as=h.filter(c=>c.k==='a'),ds=h.filter(c=>c.k==='d'),es=h.filter(c=>c.k==='e');
  const f=a=>a[rnd(a.length)];
  const nt=c=>c.t+(Math.random()<.8?c.pt:'');
  const pats=[
    ()=>[nt(ns[0]),nt(ns[1]),f(vs).t,f(es).t],
    ()=>[f(ds).t,nt(ns[0]),f(vs).t,f(es).t],
    ()=>[nt(ns[0]),f(as).t,nt(ns[1]),f(vs).t],
    ()=>[nt(ns[2]),nt(ns[3]),f(vs).t],
    ()=>[f(as).t,nt(ns[0]),nt(ns[1]),f(vs).t,f(es).t],
    ()=>['私'+f(['は','が','も']),nt(ns[0]),f(vs).t,f(es).t],
    ()=>['みんなが',f(ds).t,nt(ns[1]),f(vs).t],
    ()=>['あなたに',nt(ns[2]),'する',f(es).t]
  ];
  let parts=f(pats)();
  const extra=[()=>nt(f(ns)),()=>f(ds).t,()=>f(as).t,()=>f(vs).t,()=>nt(f(ns))];
  const want=S.exact||(S.minC||1);
  while(parts.length<want)parts.splice(Math.max(0,parts.length-1),0,f(extra)());
  while(S.exact&&parts.length>S.exact)parts.splice(Math.max(0,parts.length-2),1);
  return parts.join('');
}
function startGame(){

function toJudge(){
  clearTimers();

  S.cneed=S.clapOn?S.players.filter(p=>p.pid!==S.parent&&list.some(s=>s.pid!==p.pid)).map(p=>p.pid):[];
  if(S.clapOn)S.players.filter(p=>p.bot&&p.pid!==S.parent).forEach(b=>{
    H.timers.push(setTimeout(()=>{

}
function doResult(sid){
  clearTimers();

let HANDOVER=0;
function takerRank(){

function takeOver(why){

  S.players.forEach(p=>H.seen[p.pid]=now);S.specs.forEach(x=>H.seen[x.pid]=now);
  if(HB&&HB.code===S.code)H.hist=Object.keys(HB.items).map(Number).sort((a,b)=>a-b).map(i=>Object.assign({i},HB.items[i]));
  S.nh=H.hist.length;

/* ================= 手札・組み立て ================= */
function draw(k,hand,pool){
  const have=new Set(hand.map(c=>c.t));
  let src=pool||DECK[k];
  if(k==='e'&&!hand.some(c=>CORE_E.includes(c.t)))src=CORE_E;   // 文を閉じられる語尾を最低1枚
  let t,n=0;
  do{t=src[rnd(src.length)];n++}while(have.has(t)&&n<40);
  const c={id:++cid,t,k};
  if(k==='n'){
    const first=!hand.some(x=>x.k==='n'&&CORE_P.includes(x.pt));   // 最初の名詞は「を・に・が」のどれか
    c.pt=first?CORE_P[rnd(CORE_P.length)]:PTS[rnd(PTS.length)];
    c.on=true;
  }
  return c;
}
/* お題のジャンルに合う言葉を多めに、残りは全体から配る(ズレを少し残す) */
function makeHand(genre){
  const G=GENRES[genre]||null, hand=[];
  const forced={n:2,v:2,a:0,d:0,e:0}, prob={n:.5,v:.5,a:.7,d:.6,e:0};
  KIND_ORDER.forEach(k=>{
    for(let i=0;i<SPEC[k];i++){
      if(i===0&&G&&G.must&&G.must[k]){hand.push(draw(k,hand,G.must[k]));continue}   // 必ず1枚
      const useG=G&&G[k]&&(i<forced[k]||Math.random()<prob[k]);
      hand.push(draw(k,hand,useG?G[k]:null));
    }
  });
  return hand;
}
const baseCards=()=>BASE.map(b=>Object.assign({id:++cid,t:b.t,k:b.k,base:1},b.pt?{pt:b.pt,on:true,opts:PT_OPTS}:{},b.alts?{alts:b.alts}:{}));
const chars=c=>Array.from(c.t);
const cardBody=c=>{const a=chars(c);return a.slice(c.h||0,a.length-(c.tl||0)).join('')};
const cardText=c=>cardBody(c)+(c.pt&&c.on?c.pt:'');
/* 配信向けNG: 言葉を削ったりつなげたりしてできた文章に、直接的な性的表現が含まれていたら出せない */
const NG=W('ちんこ ちんぽ ちんぽこ ちんちん ちんげ まんこ おまんこ ぱいぱん ふぇら ふぇらちお まんずり おなにー しこしこ せっくす なかだし ぱいずり ざーめん ちくび きんたま ぼっき しゃせい せいえき 陰茎 陰毛 陰核 陰部 膣 射精 勃起 精液 精子 性器 性行為 乳首 乳輪 局部 強姦 レイプ 売春 援交 おちんちん ちんぴく ちんかす ちんこ おめこ まんすじ まんびら けつあな しりあな ふたなり ぱいおつ にくぼう たまぶくろ くぱぁ くんにりんぐす おなぬー おなにぃ てこき あしこき ぱいこき なまはめ はめどり がんしゃ せくろす せんずり あなるせっくす あなる ぽるの ろりこん 陰嚢 睾丸 亀頭 包皮 包茎 肉棒 巨根 早漏 絶倫 童貞 淫乱 淫語 淫行 痴女 痴漢 盗撮 乱交 輪姦 近親相姦 獣姦 顔射 手淫 自慰 騎乗位 正常位 後背位 前戯 性交 性欲 性奴隷 中出し 生ハメ 風俗嬢 売春婦 セクハラ 強制わいせつ わいせつ 猥褻 全裸 裸体 sex porn');
const ngNorm=t=>String(t).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s　ー・、。,.!?…「」『』()~〜_-]/g,'');
const ngNoP=t=>t.replace(/[をがはにでのともへ]/g,'');
const NGN=NG.map(ngNorm);
const ngHit=text=>{const n=ngNorm(text),m=ngNoP(n);return NGN.some(x=>n.includes(x)||(ngNoP(x).length>=3&&m.includes(ngNoP(x))))};

function tick(){
  if(!S||S.phase!=='write')return;
  const bar=$('#bar'),tm=$('#tm'),box=$('#timer');if(!bar)return;
  const left=Math.max(0,S.endsAt-(Date.now()+skew));
  tm.textContent=Math.ceil(left/1000);
  /* バーは「残り時間ぶんを一定の速さで縮む」アニメーションにする。画面を作り直しても、同じ位置から続きが始まるので跳ねない */
  const total=S.secs*1000,key=S.endsAt+'|'+S.secs;
  if(bar.dataset.k!==key){bar.dataset.k=key;bar.style.animation=`aw-bar ${total}ms linear ${-Math.min(total,total-left)}ms 1 both`}
  box.classList.toggle('low',left<=10000);

    case 'bringopt':if(isHost&&S.phase==='lobby'){S.bring=+d.v?1:0;pub()}break;

    case 'rematch':if(isHost){purgeStale();S.phase='lobby';S.players.forEach(p=>p.score=0);S.round=-1;S.pk=-1;S.endWhy='';S.nh=0;H.hist=[];H.bp=[];S.bn={};H.ghost={};pub()}break;
    case 'hand':{const c=L.hand.find(c=>c.id===+d.id);if(c&&!L.submitted&&!L.line.includes(c)){if(S.exact&&!isPunc(c)&&lineN()>=S.exact)toast('枚数縛りです。'+S.exact+'枚までしか並べられません');else{L.line.push(c);L.sel=-1}}render();break}
    case 'lsel':L.sel=(L.sel===+d.i)?-1:+d.i;render();break;

    case 'ptset':{const c=L.sel>=0?L.line[L.sel]:null;if(c&&c.opts){if(d.v==='none')c.on=false;else{c.pt=d.v;c.on=true}}render();break}
    case 'ptog':{const c=L.sel>=0?L.line[L.sel]:null;if(c&&c.pt){c.on=!c.on}render();break}
    case 'submit':doSubmit();break;
    case 'psel':if(clapReady()){L.pickSel=+d.sid;render()}break;
    case 'pick':if(L.pickSel!==null&&clapReady())reliable('pick',{sid:L.pickSel},()=>S.phase!=='judge');break;
    case 'clap':{const sid=+d.sid;if(L.clap===null){L.clap=sid;reliable('clap',{sid},()=>S.clapped.includes(me.pid)||S.phase!=='judge');render()}break}
  }
});
/* 並べたカードをつかんで動かして、順番を入れ替える(スマホはドラッグ、PCはマウスでつかんで移動) */
let DRAG=null,DRAGSUP=false;
let CUTKB=false;try{CUTKB=localStorage.getItem('aw_cutmode')==='kb'}catch(e){}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('.line [data-a="lsel"]');
  if(!el||(e.pointerType==='mouse'&&e.button!==0))return;
  DRAG={el,i:+el.dataset.i,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,to:-1,after:false,late:0};
});
document.addEventListener('pointermove',e=>{
  if(!DRAG||e.pointerId!==DRAG.id)return;
  const dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;
  if(!DRAG.on){
    if(Math.hypot(dx,dy)<8)return;
    DRAG.on=true;DRAG.el.classList.add('drag');
    try{DRAG.el.setPointerCapture(e.pointerId)}catch(_){}
  }
  e.preventDefault();
  DRAG.el.style.transform=`translate(${dx}px,${dy}px)`;
  const chips=[...document.querySelectorAll('.line [data-a="lsel"]')];
  chips.forEach(c=>c.classList.remove('dropb','dropa'));
  let best=null,bd=1e9;
  chips.forEach(c=>{if(c===DRAG.el)return;const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(e.clientX-cx,(e.clientY-cy)*2);if(d<bd){bd=d;best=c;DRAG.after=e.clientX>=cx}});
  if(best){DRAG.to=+best.dataset.i;best.classList.add(DRAG.after?'dropa':'dropb')}else DRAG.to=-1;
},{passive:false});
function dragEnd(e){
  if(!DRAG||e.pointerId!==DRAG.id)return;
  const D=DRAG;DRAG=null;
  if(!D.on)return;
  DRAGSUP=true;setTimeout(()=>{DRAGSUP=false},80);
  if(D.to>=0&&D.to!==D.i&&L.line[D.i]){
    const item=L.line.splice(D.i,1)[0];
    let idx=D.to>D.i?D.to-1:D.to;if(D.after)idx+=1;
    idx=Math.max(0,Math.min(L.line.length,idx));
    L.line.splice(idx,0,item);L.sel=idx;
  }
  render();
}
document.addEventListener('pointerup',dragEnd);
document.addEventListener('pointercancel',dragEnd);
document.addEventListener('click',e=>{if(DRAGSUP){e.stopImmediatePropagation();e.preventDefault();DRAGSUP=false}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.line [data-a="lsel"]'))e.preventDefault()});
/* 優勝文の画像化(canvasで描いて、プレビューを出し、共有・保存できる) */
async function histImage(list){
  try{await Promise.all([document.fonts.load('800 40px "Shippori Mincho B1"'),document.fonts.load('700 28px "Zen Maru Gothic"'),document.fonts.load('900 40px "Dela Gothic One"')])}catch(e){}
  const W=1080,P=64,SER='"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif',SANS='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif',DISP='"Dela Gothic One","Zen Maru Gothic",sans-serif';
  const cv=document.createElement('canvas'),g=cv.getContext('2d');
  const wrap=(txt,font,maxW)=>{g.font=font;const out=[];let cur='';for(const ch of Array.from(String(txt))){if(cur&&g.measureText(cur+ch).width>maxW){out.push(cur);cur=ch}else cur+=ch}if(cur)out.push(cur);return out};
  const single=list.length===1, inner=W-P*2-72;
  const blocks=list.map(e=>{
    const fs=single?(e.t.length>44?50:e.t.length>26?60:72):42, lh=Math.round(fs*1.5);
    const qf=`700 ${single?30:24}px ${SANS}`, ql=wrap(`第${e.r}ラウンド ・ ${e.q}`,qf,W-P*2);
    const tf=`800 ${fs}px ${SER}`, tl=wrap(e.t,tf,inner);
    const cardH=tl.length*lh+(single?150:112), qlh=single?44:36;
    return {e,fs,lh,qf,ql,tf,tl,cardH,qlh,h:ql.length*qlh+16+cardH};
  });
  const headH=single?250:250, footH=110, gap=single?0:40;
  let H=headH+blocks.reduce((s,b)=>s+b.h,0)+gap*(blocks.length-1)+footH;
  if(single)H=Math.max(H,1080);
  cv.width=W;cv.height=H;
  g.fillStyle='#17161d';g.fillRect(0,0,W,H);
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  g.textBaseline='alphabetic';g.textAlign='left';
  g.fillStyle='#ffd23f';g.font=`400 76px ${DISP}`;g.fillText('ありあわせ',P,P+84);
  g.fillStyle='#a39fb3';g.font=`700 30px ${SANS}`;g.fillText(single?'今日の優勝文':'各ラウンドの優勝文',P,P+140);
  let y=headH+(single?Math.max(0,(H-headH-footH-blocks[0].h)/2):0);
  blocks.forEach(b=>{
    g.fillStyle='#a39fb3';g.font=b.qf;b.ql.forEach((l,i)=>g.fillText(l,P,y+(i+1)*b.qlh-8));
    y+=b.ql.length*b.qlh+16;
    g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=24;g.shadowOffsetY=8;g.fillStyle='#f6f0e2';rr(P,y,W-P*2,b.cardH,18);g.fill();g.restore();
    g.fillStyle='#1d1a16';g.font=b.tf;b.tl.forEach((l,i)=>g.fillText(l,P+36,y+(single?50:36)+(i+1)*b.lh-b.lh*0.2));
    g.fillStyle='#c0275a';g.font=`900 ${single?36:30}px ${SANS}`;g.textAlign='right';g.fillText('— '+b.e.n,W-P-36,y+b.cardH-(single?34:26));g.textAlign='left';
    y+=b.cardH+gap;
  });
  g.fillStyle='#6f6b80';g.font=`700 26px ${SANS}`;g.textAlign='center';g.fillText('ありあわせ — 手札の言葉でつくる一言ゲーム',W/2,H-48);
  return await new Promise(res=>cv.toBlob(res,'image/png'));
}
async function showImage(list){
  toast('画像をつくっています…');
  let blob=null;try{blob=await histImage(list)}catch(e){}
  if(!blob){toast('画像をつくれませんでした');return}
  const tt=$('#toast');if(tt)tt.classList.remove('show');
  const url=URL.createObjectURL(blob),name='ありあわせ_優勝文.png';
  const old=document.getElementById('imgov');if(old)old.remove();
  const ov=document.createElement('div');ov.id='imgov';
  ov.innerHTML=`<img alt="優勝文の画像" src="${url}"><div class="row"><button class="btn sm" id="imgsave">共有・保存</button><button class="btn ghost sm" id="imgclose">閉じる</button></div><p>スマホは画像を長押しでも保存できます</p>`;
  document.body.appendChild(ov);
  const close=()=>{ov.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
  ov.querySelector('#imgclose').onclick=close;
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  ov.querySelector('#imgsave').onclick=async()=>{
    const f=new File([blob],name,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'ありあわせ'});return}}catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('保存しました');
  };
}
function histImgClick(i){
  const items=histItems(),ids=Object.keys(items).map(Number).sort((a,b)=>a-b);
  const list=i==='all'?ids.map(k=>items[k]):(items[+i]?[items[+i]]:[]);
  if(list.length)showImage(list);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.getElementById('imgov');if(o)o.remove()}});
/* キーボードで削る: 元のカードの文字の「連続した一部」になっているときだけ受け付ける(先頭・末尾から消す/消した文字を打ち直す) */
function cutTyped(inp){
  const c=L.sel>=0?L.line[L.sel]:null;if(!c||c.base)return;
  const a=chars(c),n=a.length,v=Array.from(inp.value.normalize('NFC')),m=v.length,cur=c.h||0;
  let best=-1;
  if(m>=1&&m<=n)for(let i=0;i+m<=n;i++){if(a.slice(i,i+m).join('')===v.join('')&&(best<0||Math.abs(i-cur)<Math.abs(best-cur)))best=i}
  if(best>=0){c.h=best;c.tl=n-best-m}
  else toast(m<1?'1文字は残してね':'先頭か末尾から消すだけです。消した文字だけ打ち直せます');
  render();
}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.id==='cutin'&&!e.isComposing)cutTyped(t)});
document.addEventListener('compositionend',e=>{const t=e.target;if(t&&t.id==='cutin')setTimeout(()=>{if($('#cutin')===t)cutTyped(t)},0)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='cutin'){e.preventDefault();e.target.blur()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='bringin'){e.preventDefault();bringAdd()}});
render();
/* 起動時: ホストなら直前の状態から再開、参加者なら直前の部屋へ自動で入り直す(ページの読み込み直しや、タブが落ちたとき用) */
(function boot(){
  const FRESH=15*60*1000;
  let snap=null;try{snap=JSON.parse(store('hsnap')||'null')}catch(e){}
  if(snap&&snap.S&&snap.S.hostPid===me.pid&&snap.S.code&&Date.now()-snap.t<FRESH){resumeHost(snap);return}
  let rm=null;try{rm=JSON.parse(store('room')||'null')}catch(e){}
  if(rm&&rm.code&&Date.now()-rm.t<FRESH&&me.name)joinRoom({code:rm.code,spec:rm.spec,auto:1});
})();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&typeof claude==='undefined'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
